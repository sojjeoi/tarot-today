          <span class="rule" aria-hidden="true"></span>
          <p class="panel__says">당신이 적은 고민에 대해 <strong class="cname" id="cname"></strong><span id="josa"></span> 이렇게 말합니다:</p>
          <p class="panel__verdict" id="verdict"></p>
          <p class="panel__kw" id="keywords"></p>
        </article>
      </div>

      <button class="btn btn--again" id="againBtn" type="button">다시 질문하기</button>
    </section>
  </main>

  <!-- 뒤집히는 카드 (문서 좌표계로 날아다니는 레이어) -->
  <div class="flight" aria-hidden="true">
    <div class="hero-card" id="heroCard" hidden>
      <div class="hero-flip" id="heroFlip">
        <div class="face face--back"></div>
        <div class="face face--front">
          <span class="front-num" id="fNum"></span>
          <span class="front-symbol" id="fSymbol"></span>
          <span class="front-ko" id="fKo"></span>
          <span class="front-en" id="fEn"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- RGB 프리즘 글로우: 카드가 뒤집히는 순간에만 사용 -->
  <div class="prism" id="prism" aria-hidden="true">
    <i class="prism__rays"></i>
    <i class="prism__blob prism__blob--r"></i>
    <i class="prism__blob prism__blob--b"></i>
    <i class="prism__blob prism__blob--g"></i>
    <i class="prism__ring prism__ring--r"></i>
    <i class="prism__ring prism__ring--g"></i>
    <i class="prism__ring prism__ring--b"></i>
  </div>

  <script src="script.js"></script>
</body>
</html>
